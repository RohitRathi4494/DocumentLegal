services:
  - type: web
    name: docwriter-api
    env: docker
    rootDir: backend
    envVars:
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_DEBUG
        value: "False"
      - key: ALLOWED_HOSTS
        value: ".onrender.com"
      - key: DATABASE_URL
        fromDatabase:
          name: docwriter-db
          property: connectionString

databases:
  - name: docwriter-db
    plan: free
    databaseName: docwriter
    user: docwriter
