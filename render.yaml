services:
  - type: web
    name: docwriter-api
    env: docker
    rootDir: backend
    envVars:
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_DEBUG
        value: "False"
      - key: ALLOWED_HOSTS
        value: ".onrender.com"
      - key: DATABASE_URL
        fromDatabase:
          name: docwriter-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: docwriter-redis
          property: connectionString

  - type: worker
    name: docwriter-celery
    env: docker
    rootDir: backend
    dockerCommand: celery -A legal_engine worker -l info
    envVars:
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_DEBUG
        value: "False"
      - key: ALLOWED_HOSTS
        value: ".onrender.com"
      - key: DATABASE_URL
        fromDatabase:
          name: docwriter-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: docwriter-redis
          property: connectionString

  - type: redis
    name: docwriter-redis
    plan: free

databases:
  - name: docwriter-db
    plan: free
    databaseName: docwriter
    user: docwriter
